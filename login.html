<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Auxiliar Odont</title>
    <!-- SEO -->
    <meta name="description" content="Faça login para acessar o sistema Auxiliar Odont.">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Bootstrap Icons e CSS Global -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
    <!-- CSS Exclusivo da Página de Login (Sempre depois do custom.css para sobrescrever) -->
    <link href="assets/css/login.css" rel="stylesheet">
</head>

<body>
    <body class="login-page">
    <!-- todo o conteúdo do login permanece igual -->
</body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="bi bi-shield-lock-fill"></i>
                <h2>Bem-vindo</h2>
                
                <p>Faça login para continuar</p>
            </div>

            <div class="alert d-none" id="errorAlert" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-box">
                        <i class="bi bi-envelope-fill left-icon"></i>
                        <input type="email" name="email" id="email" placeholder="Digite seu email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-box">
                        <i class="bi bi-lock-fill left-icon"></i>
                        <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
                        <i class="bi bi-eye-fill toggle-password" id="toggleSenha" title="Mostrar senha"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
            </form>

            <div class="link-row">
                <a href="registro.html">Criar conta</a>
            </div>
        </div>
    </div>

    <!-- Script para mostrar/ocultar senha -->
    <script>
        const senha = document.getElementById("senha");
        const toggleSenha = document.getElementById("toggleSenha");
        toggleSenha.addEventListener("click", () => {
            const tipo = senha.getAttribute("type") === "password" ? "text" : "password";
            senha.setAttribute("type", tipo);
            toggleSenha.classList.toggle("bi-eye-fill");
            toggleSenha.classList.toggle("bi-eye-slash-fill");
        });
    </script>
    <script type="module" src="assets/js/login.js"></script>
</body>

</html>

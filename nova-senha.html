<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alterar Senha - Auxiliar Odont</title>
    <link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
</head>

<body class="theme-light">
    <div id="app-shell"></div>

    <div class="main-content">
        <div class="container-fluid py-4" style="max-width:560px">

            <h2 class="page-title"><i class="bi bi-key"></i> Alterar senha</h2>
            <p class="text-muted" id="contaAtual"></p>

            <div class="alert alert-danger d-none" id="errorAlert" role="alert"></div>

            <div class="card shadow border-0 rounded-4 p-4">
                <form id="senhaForm" class="d-none" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="senhaAtual">Senha atual</label>
                        <input type="password" class="form-control" id="senhaAtual" autocomplete="current-password" required>
                        <div class="invalid-feedback" id="senhaAtualErro"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="senha">Nova senha</label>
                        <input type="password" class="form-control" id="senha" autocomplete="new-password" required>
                        <div class="form-text">Pelo menos 8 caracteres, com letras e números.</div>
                        <div class="invalid-feedback" id="senhaErro"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="confirmarSenha">Confirme a nova senha</label>
                        <input type="password" class="form-control" id="confirmarSenha" autocomplete="new-password" required>
                        <div class="invalid-feedback" id="confirmarSenhaErro"></div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="mostrarSenha">
                        <label class="form-check-label" for="mostrarSenha">Mostrar senha</label>
                    </div>
                    <button class="btn btn-primary w-100" id="btnSalvar">Salvar nova senha</button>
                </form>

                <div class="text-center d-none" id="sucesso">
                    <i class="bi bi-check-circle-fill text-success" style="font-size:40px;"></i>
                    <h5 class="mt-2">Senha alterada</h5>
                    <p class="text-muted">Use a nova senha nos próximos acessos.</p>
                    <a class="btn btn-primary" href="dashboard.html"><i class="bi bi-house"></i> Ir para o Dashboard</a>
                </div>
            </div>

        </div>
    </div>

    <footer><small>© <span id="year"></span> - Auxiliar Odont | Sistema de Controle de Estoque</small></footer>

    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
    <script type="module" src="assets/js/nova-senha.js"></script>
</body>

</html>

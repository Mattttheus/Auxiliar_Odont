<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Caixa (PDV) - Auxiliar Odont</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
</head>

<body class="theme-light">
    <div id="app-shell"></div>

    <div class="main-content">
        <div class="container-fluid py-4">

            <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
                <div>
                    <h2 class="page-title"><i class="bi bi-cash-register"></i> Caixa (PDV)</h2>
                    <p class="text-muted">Registre vendas rapidamente escaneando ou selecionando produtos</p>
                </div>
                <a class="btn btn-primary btn-custom" href="dashboard.html"><i class="bi bi-house"></i> Dashboard</a>
            </div>

            <div class="row g-4">
                <div class="col-lg-5">
                    <div class="card shadow border-0 rounded-4 p-4">
                        <h5><i class="bi bi-search"></i> Adicionar Produto</h5>
                        <div class="mb-3">
                            <label class="form-label">Produto</label>
                            <div class="input-group">
                                <select class="form-select" id="caixaProdutoId"></select>
                                <button type="button" class="btn btn-outline-secondary" id="btnScanCaixa"
                                    title="Escanear código de barras"><i class="bi bi-upc-scan"></i></button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantidade</label>
                            <input type="number" class="form-control" id="caixaQuantidade" min="1" value="1">
                        </div>
                        <button class="btn btn-primary w-100" id="btnAdicionarCarrinho"><i class="bi bi-cart-plus"></i>
                            Adicionar ao Carrinho</button>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="card shadow border-0 rounded-4 p-4">
                        <h5><i class="bi bi-cart-check"></i> Carrinho</h5>
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Produto</th>
                                        <th style="width:100px">Qtd</th>
                                        <th>Preço</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="carrinhoBody"></tbody>
                            </table>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                            <h4 class="mb-0">Total: <span id="carrinhoTotal" class="text-success">R$ 0,00</span></h4>
                            <button class="btn btn-success btn-lg" id="btnFinalizarVenda"><i
                                    class="bi bi-check-circle"></i> Finalizar Venda</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer><small>© <span id="year"></span> - Auxiliar Odont | Sistema de Controle de Estoque</small></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
    <script type="module" src="assets/js/caixa.js"></script>
</body>

</html>

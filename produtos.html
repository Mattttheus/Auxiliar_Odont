<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produtos - Auxiliar Odont</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
    <style>
        .card-dashboard {
            border: none;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            transition: .3s;
        }

        .card-dashboard:hover {
            transform: translateY(-3px);
        }

        .table-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            overflow-x: auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .05);
        }

        .low-stock {
            color: #dc3545;
            font-weight: bold;
        }

        .icon-card {
            font-size: 32px;
            opacity: .85;
        }

        .btn-custom {
            border-radius: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body class="theme-light">
    <div id="app-shell"></div>

    <div class="main-content">
        <div class="container-fluid py-4">

            <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
                <div>
                    <h2 class="page-title"><i class="bi bi-box-seam"></i> Gestão de Produtos</h2>
                    <p class="text-muted">Controle completo do estoque odontológico</p>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-secondary btn-custom" id="btnExportCsv"><i class="bi bi-download"></i>
                        CSV</button>
                    <button class="btn btn-success btn-custom" id="btnNovoProduto"><i class="bi bi-plus-lg"></i> Novo
                        Produto</button>
                    <a class="btn btn-primary btn-custom" href="dashboard.html"><i class="bi bi-house"></i>
                        Dashboard</a>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="card-dashboard bg-white">
                        <div class="d-flex justify-content-between">
                            <div><small>Total Produtos</small>
                                <h2 id="statTotal">0</h2>
                            </div>
                            <i class="bi bi-box icon-card text-primary"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-dashboard bg-danger text-white">
                        <div class="d-flex justify-content-between">
                            <div><small>Vencidos</small>
                                <h2 id="statVencidos">0</h2>
                            </div>
                            <i class="bi bi-exclamation-triangle icon-card"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-dashboard bg-warning">
                        <div class="d-flex justify-content-between">
                            <div><small>Prestes a vencer</small>
                                <h2 id="statPrestes">0</h2>
                            </div>
                            <i class="bi bi-hourglass-split icon-card"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-dashboard bg-info text-white">
                        <div class="d-flex justify-content-between">
                            <div><small>Baixo estoque</small>
                                <h2 id="statBaixo">0</h2>
                            </div>
                            <i class="bi bi-graph-down icon-card"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="filters mb-3">
                <button class="btn btn-outline-primary filter-btn active" data-filter="todos">Todos</button>
                <button class="btn btn-outline-danger filter-btn" data-filter="vencidos">Vencidos</button>
                <button class="btn btn-outline-warning filter-btn" data-filter="prestes">Prestes a vencer</button>
                <button class="btn btn-outline-info filter-btn" data-filter="baixo">Baixo estoque</button>
            </div>

            <div class="table-container">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Validade</th>
                            <th>Status</th>
                            <th width="260">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="produtosTableBody"></tbody>
                </table>
            </div>

        </div>
    </div>

    <footer><small>© <span id="year"></span> - Auxiliar Odont | Sistema de Controle de Estoque</small></footer>

    <!-- Modal Produto -->
    <div class="modal fade" id="modalProduto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formProduto">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalProdutoTitle">Novo Produto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="produtoId">
                        <div class="mb-3"><label class="form-label">Nome</label><input class="form-control"
                                id="produtoNome" required></div>
                        <div class="mb-3"><label class="form-label">Descrição</label><textarea class="form-control"
                                id="produtoDescricao"></textarea></div>
                        <div class="mb-3"><label class="form-label">Preço</label><input class="form-control"
                                type="number" step="0.01" id="produtoPreco" required></div>
                        <div class="mb-3"><label class="form-label">Quantidade</label><input class="form-control"
                                type="number" id="produtoQuantidade" required></div>
                        <div class="mb-3"><label class="form-label">Validade</label><input class="form-control"
                                type="date" id="produtoValidade" required></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Entrada -->
    <div class="modal fade" id="modalEntrada" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formEntrada">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="bi bi-box-arrow-in-down"></i> Entrada de Produto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Produto</label>
                            <select class="form-select" id="entradaProdutoId" required></select>
                        </div>
                        <div class="mb-3"><label class="form-label">Quantidade</label><input class="form-control"
                                type="number" min="1" id="entradaQuantidade" required></div>
                        <div class="mb-3"><label class="form-label">Observação</label><input class="form-control"
                                id="entradaObservacao"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Registrar Entrada</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Saída -->
    <div class="modal fade" id="modalSaida" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formSaida">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="bi bi-box-arrow-up"></i> Saída de Produto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Produto</label>
                            <select class="form-select" id="saidaProdutoId" required></select>
                        </div>
                        <div class="mb-3"><label class="form-label">Quantidade</label><input class="form-control"
                                type="number" min="1" id="saidaQuantidade" required></div>
                        <div class="mb-3"><label class="form-label">Observação</label><input class="form-control"
                                id="saidaObservacao"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">Registrar Saída</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
    <script type="module" src="assets/js/produtos.js"></script>
</body>

</html>

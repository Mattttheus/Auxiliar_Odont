<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar Conta - Auxiliar Odont</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            font-family: 'Segoe UI', sans-serif;
        }

        .card-register {
            max-width: 460px;
            width: 100%;
            border: none;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
        }
    </style>
</head>

<body>
    <div class="card card-register p-4 m-3">
        <div class="text-center mb-3">
            <i class="bi bi-person-plus-fill" style="font-size:50px;color:#5b21b6;"></i>
            <h3 class="fw-bold mt-2">Criar Conta</h3>
            <p class="text-muted">Sistema de Controle de Estoque</p>
        </div>

        <div class="alert alert-danger d-none" id="errorAlert"></div>

        <form id="registroForm">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input class="form-control" name="nome" id="nome" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" name="email" id="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" name="senha" id="senha" minlength="6" required>
            </div>
            <button class="btn btn-primary w-100" id="btnRegistrar">Cadastrar</button>
        </form>

        <div class="text-center mt-3">
            <a href="index.html">Já tenho conta, entrar</a>
        </div>
    </div>

    <script type="module" src="assets/js/registro.js"></script>
</body>

</html>

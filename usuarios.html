<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Usuários - Auxiliar Odont</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
</head>

<body class="theme-light">
    <div id="app-shell"></div>

    <div class="main-content">
        <div class="container-fluid py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold"><i class="bi bi-people-fill"></i> Gerenciar Usuários</h2>
                    <p class="text-muted mb-0">Usuários cadastrados no sistema</p>
                </div>
                <button class="btn btn-success" id="btnNovoUsuario"><i class="bi bi-person-plus-fill"></i> Criar
                    Usuário</button>
            </div>

            <div id="msgContainer"></div>

            <div class="table-container">
                <table class="table table-hover table-bordered align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Perfil</th>
                            <th>Status</th>
                            <th>Criado em</th>
                            <th width="200">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="usuariosTableBody"></tbody>
                </table>
            </div>

        </div>
    </div>

    <footer><small>© <span id="year"></span> - Auxiliar Odont | Sistema de Controle de Estoque</small></footer>

    <!-- Modal Usuário -->
    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formUsuario">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalUsuarioTitle">Novo Usuário</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="usuarioId">
                        <div class="mb-3"><label class="form-label">Nome</label><input class="form-control"
                                id="usuarioNome" required></div>
                        <div class="mb-3"><label class="form-label">E-mail</label><input type="email"
                                class="form-control" id="usuarioEmail" required></div>
                        <div class="mb-3" id="senhaGroup"><label class="form-label">Senha</label><input type="password"
                                class="form-control" id="usuarioSenha" minlength="6"><small class="text-muted"
                                id="senhaHelp"></small></div>
                        <div class="mb-3">
                            <label class="form-label">Perfil</label>
                            <select class="form-select" id="usuarioRole">
                                <option value="user">Usuário</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="usuarioAtivo" checked>
                            <label class="form-check-label" for="usuarioAtivo">Ativo</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
    <script type="module" src="assets/js/usuarios.js"></script>
</body>

</html>

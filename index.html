<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Auxiliar Odont</title>
</head>
<body>
  <p>Carregando...</p>
  <script>
    const hash = window.location.hash;

    // Se o Supabase mandou um erro no hash (ex: link expirado)
    if (hash && hash.includes("error=")) {
      const params = new URLSearchParams(hash.replace(/^#/, ""));
      const desc = (params.get("error_description") || "Link inválido ou expirado").replace(/\+/g, " ");
      sessionStorage.setItem("authError", desc);
      window.location.replace("login.html");
      return;
    }

    // Se veio token de sessão no hash (confirmação de email), deixa o supabase-init processar
    // Redireciona para login mantendo o hash — o SDK extrai a sessão do hash automaticamente
    if (hash && hash.includes("access_token=")) {
      window.location.replace("login.html" + hash);
      return;
    }

    // Nenhum erro, nenhum token — decide por sessão existente
    if (sessionStorage.getItem("auxiliarOdontUser")) {
      window.location.replace("dashboard.html");
    } else {
      window.location.replace("login.html");
    }
  </script>
</body>
</html>

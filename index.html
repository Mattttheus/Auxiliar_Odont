<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Auxiliar Odont</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
            color: #fff;
            animation: fadeIn .8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 60px;
            margin-bottom: 10px;
            display: block;
        }

        .logo h2 {
            font-size: 28px;
            font-weight: 700;
        }

        .logo p {
            color: rgba(255, 255, 255, .8);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 15px 45px;
            border: none;
            outline: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, .15);
            color: #fff;
            font-size: 15px;
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, .7);
        }

        .input-box i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
        }

        .input-box .left-icon {
            left: 15px;
        }

        .toggle-password {
            right: 15px;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: #fff;
            color: #5b21b6;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .2);
        }

        .alert {
            background: #ff4d4d;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .link-row {
            text-align: center;
            margin-top: 18px;
        }

        .link-row a {
            color: #fff;
            text-decoration: underline;
        }

        @media(max-width:480px) {
            .login-card {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="bi bi-shield-lock-fill"></i>
                <h2>Bem-vindo</h2>
                <p>Faça login para continuar</p>
            </div>

            <div class="alert d-none" id="errorAlert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-box">
                        <i class="bi bi-envelope-fill left-icon"></i>
                        <input type="email" name="email" id="email" placeholder="Digite seu email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-box">
                        <i class="bi bi-lock-fill left-icon"></i>
                        <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
                        <i class="bi bi-eye-fill toggle-password" id="toggleSenha"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
            </form>

            <div class="link-row">
                <a href="registro.html">Criar conta</a>
            </div>
        </div>
    </div>

    <script>
        const senha = document.getElementById("senha");
        const toggleSenha = document.getElementById("toggleSenha");
        toggleSenha.addEventListener("click", () => {
            const tipo = senha.getAttribute("type") === "password" ? "text" : "password";
            senha.setAttribute("type", tipo);
            toggleSenha.classList.toggle("bi-eye-fill");
            toggleSenha.classList.toggle("bi-eye-slash-fill");
        });
    </script>
    <script type="module" src="assets/js/login.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Histórico - Auxiliar Odont</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
</head>

<body class="theme-light">
    <div id="app-shell"></div>

    <div class="main-content">
        <div class="container-fluid py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold"><i class="bi bi-clock-history"></i> Histórico do Sistema</h2>
                    <small class="text-muted">Histórico de ações e saídas do estoque</small>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-secondary" id="btnExportCsv"><i class="bi bi-download"></i> Exportar
                        CSV</button>
                    <a href="dashboard.html" class="btn btn-primary"><i class="bi bi-house-door-fill"></i> Dashboard</a>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="card border-0 shadow bg-primary text-white">
                        <div class="card-body text-center">
                            <h5>Total de Ações</h5>
                            <h1 id="statTotalHistorico">0</h1>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card border-0 shadow bg-danger text-white">
                        <div class="card-body text-center">
                            <h5>Total de Saídas</h5>
                            <h1 id="statTotalSaidas">0</h1>
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <h5 class="mb-3">Histórico Geral</h5>
                <table class="table table-hover align-middle mb-5">
                    <thead>
                        <tr>
                            <th>Usuário</th>
                            <th>Produto</th>
                            <th>Ação</th>
                            <th>Descrição</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody id="historicoTableBody"></tbody>
                </table>

                <h5 class="mb-3">Saídas de Estoque</h5>
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Usuário</th>
                            <th>Observação</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody id="saidasTableBody"></tbody>
                </table>
            </div>

        </div>
    </div>

    <footer><small>© <span id="year"></span> - Auxiliar Odont | Sistema de Controle de Estoque</small></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
    <script type="module" src="assets/js/historico.js"></script>
</body>

</html>
